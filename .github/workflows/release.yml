name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2025

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the repository npm version
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the repository npm version
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Verify exact release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const root = readJson("package.json");
          const plugin = readJson("plugins/atbash/package.json");
          const manifest = readJson("plugins/atbash/.codex-plugin/plugin.json");
          const versions = [root.version, plugin.version, manifest.version];
          if (!versions.every((version) => typeof version === "string" && /^\d+\.\d+\.\d+$/.test(version))) {
            throw new Error("Release versions must all be exact stable semver values");
          }
          if (!versions.every((version) => version === versions[0])) {
            throw new Error("Root, plugin, and marketplace manifest versions must match exactly");
          }
          if (process.env.RELEASE_TAG !== `v${versions[0]}`) {
            throw new Error("Release tag must exactly match the package version");
          }
          NODE

      - name: Verify committed universal marketplace runtime
        run: npm run build:marketplace && git diff --exit-code -- plugins/atbash/runtime

      - name: Package plugin
        run: npm pack --workspace @atbash/codex-plugin
