name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The serial Windows ACL/bootstrap suite launches real PowerShell helpers.
    # Keep the full suite within CI's job budget instead of cancelling it.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the repository npm version
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows ACL helper startup
        if: runner.os == 'Windows'
        run: npm run build --workspace @atbash/codex-plugin && npx tsc -p plugins/atbash/tsconfig.test.json && node --test plugins/atbash/dist-tests/tests/windows-module-path.test.js

      - name: Verify
        run: npm run verify

      - name: Verify committed universal marketplace runtime
        run: npm run build:marketplace && git diff --exit-code -- plugins/atbash/runtime

      - name: Package submission candidate
        if: runner.os == 'Linux'
        run: npm run package:submission
