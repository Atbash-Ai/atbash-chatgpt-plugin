name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify committed marketplace runtime
        run: npm run build:marketplace && git diff --exit-code -- plugins/atbash/runtime

      - name: Package submission candidate
        run: npm run package:submission

      - name: Upload submission candidate
        uses: actions/upload-artifact@v4
        with:
          name: atbash-submission
          path: artifacts/
